<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Can't Stop graphical checks</title></head>
<body style="margin:0"><p id="result" role="status">Running Can't Stop graphical checks…</p><iframe id="app" title="Playable Can't Stop app" src="../index.html" style="width:100%;height:1000px;border:0"></iframe>
<script type="module">
const app = document.getElementById("app"), result = document.getElementById("result");
app.addEventListener("load", () => {
  const script = app.contentDocument.createElement("script"); script.type = "module";
  script.textContent = 'import { runCantStopChecks } from "./tests/cantstop-play.js"; window.cantStopChecks = runCantStopChecks(); window.cantStopChecks.then(value => parent.document.getElementById("result").textContent = JSON.stringify(value)).catch(error => parent.document.getElementById("result").textContent = error.stack);';
  app.contentDocument.body.append(script);
});
</script></body></html>
