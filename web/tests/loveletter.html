<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Love Letter graphical checks</title></head>
<body style="margin:0"><p id="result" role="status">Running Love Letter graphical checks...</p><iframe id="app" title="Playable Love Letter app" src="../index.html" style="width:100%;height:1100px;border:0"></iframe>
<script type="module">
const app=document.getElementById("app");
app.addEventListener("load",()=>{
  const script=app.contentDocument.createElement("script");script.type="module";
  script.textContent='import { runLoveLetterChecks } from "./tests/loveletter-play.js"; window.loveLetterChecks=runLoveLetterChecks(); window.loveLetterChecks.then(value=>parent.document.getElementById("result").textContent=JSON.stringify(value)).catch(error=>parent.document.getElementById("result").textContent=error.stack);';
  app.contentDocument.body.append(script);
});
</script></body></html>
