<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650"
    viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">Board to x-major cell vector</title>
  <desc id="description">Player 0 sees X at column 1 row 2 and O at column 2 row 0. Reading down each column gives [0,0,0,0,0,1,-1,0,0]. X maps to index 5 and O to index 6 using x times height plus y.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M 0 0 L 8 4 L 0 8 Z" fill="#526178"/>
  </marker></defs>
  <rect width="1000" height="650" rx="12" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="43" font-size="28" fill="#172033" text-anchor="start" font-weight="bold">1. Turn the board into a vector</text><text x="32" y="77" font-size="18" fill="#172033" text-anchor="start" font-weight="normal">Player 0 is observing: X is own, O is opposing. Coordinates start at zero.</text><text x="62" y="121" font-size="20" fill="#172033" text-anchor="start" font-weight="bold">The board</text><text x="161.0" y="145" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">column x</text><text x="97.0" y="173" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">0</text><text x="48" y="228.0" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">0</text><text x="161.0" y="173" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">1</text><text x="48" y="292.0" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">1</text><text x="225.0" y="173" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">2</text><text x="48" y="356.0" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">2</text><text x="48" y="411" font-size="16" fill="#526178" text-anchor="start" font-weight="normal">row y</text><rect x="65" y="190" width="64" height="64" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="97.0" y="230.96" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><text x="121" y="246" font-size="13" fill="#526178" text-anchor="end" font-weight="normal">0</text><rect x="129" y="190" width="64" height="64" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="161.0" y="230.96" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><text x="185" y="246" font-size="13" fill="#526178" text-anchor="end" font-weight="normal">3</text><rect x="193" y="190" width="64" height="64" rx="6" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/><text x="225.0" y="230.96" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold">O</text><text x="249" y="246" font-size="13" fill="#526178" text-anchor="end" font-weight="normal">6</text><rect x="65" y="254" width="64" height="64" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="97.0" y="294.96" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><text x="121" y="310" font-size="13" fill="#526178" text-anchor="end" font-weight="normal">1</text><rect x="129" y="254" width="64" height="64" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="161.0" y="294.96" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><text x="185" y="310" font-size="13" fill="#526178" text-anchor="end" font-weight="normal">4</text><rect x="193" y="254" width="64" height="64" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="225.0" y="294.96" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><text x="249" y="310" font-size="13" fill="#526178" text-anchor="end" font-weight="normal">7</text><rect x="65" y="318" width="64" height="64" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="97.0" y="358.96" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><text x="121" y="374" font-size="13" fill="#526178" text-anchor="end" font-weight="normal">2</text><rect x="129" y="318" width="64" height="64" rx="6" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="161.0" y="358.96" font-size="30" fill="#1d4ed8" text-anchor="middle" font-weight="bold">X</text><text x="185" y="374" font-size="13" fill="#526178" text-anchor="end" font-weight="normal">5</text><rect x="193" y="318" width="64" height="64" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="225.0" y="358.96" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><text x="249" y="374" font-size="13" fill="#526178" text-anchor="end" font-weight="normal">8</text><text x="380" y="151" font-size="22" fill="#172033" text-anchor="start" font-weight="bold">cells</text><text x="955" y="151" font-size="20" fill="#526178" text-anchor="end" font-weight="normal">shape [9]</text><path d="M 286 275 L 350 275" fill="none" stroke="#526178" stroke-width="2.5" marker-end="url(#arrow)"/><text x="380" y="199" font-size="15" fill="#526178" text-anchor="start" font-weight="normal">index</text><text x="412" y="225" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">0</text><rect x="380" y="240" width="64" height="62" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="412" y="280" font-size="24" fill="#172033" text-anchor="middle" font-weight="bold">0</text><text x="476" y="225" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">1</text><rect x="444" y="240" width="64" height="62" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="476" y="280" font-size="24" fill="#172033" text-anchor="middle" font-weight="bold">0</text><text x="540" y="225" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">2</text><rect x="508" y="240" width="64" height="62" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="540" y="280" font-size="24" fill="#172033" text-anchor="middle" font-weight="bold">0</text><text x="604" y="225" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">3</text><rect x="572" y="240" width="64" height="62" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="604" y="280" font-size="24" fill="#172033" text-anchor="middle" font-weight="bold">0</text><text x="668" y="225" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">4</text><rect x="636" y="240" width="64" height="62" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="668" y="280" font-size="24" fill="#172033" text-anchor="middle" font-weight="bold">0</text><text x="732" y="225" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">5</text><rect x="700" y="240" width="64" height="62" rx="6" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="732" y="280" font-size="24" fill="#1d4ed8" text-anchor="middle" font-weight="bold">+1</text><text x="796" y="225" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">6</text><rect x="764" y="240" width="64" height="62" rx="6" fill="#ffedd5" stroke="#cbd5e1" stroke-width="1.5"/><text x="796" y="280" font-size="24" fill="#9a3412" text-anchor="middle" font-weight="bold">-1</text><text x="860" y="225" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">7</text><rect x="828" y="240" width="64" height="62" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="860" y="280" font-size="24" fill="#172033" text-anchor="middle" font-weight="bold">0</text><text x="924" y="225" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">8</text><rect x="892" y="240" width="64" height="62" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="924" y="280" font-size="24" fill="#172033" text-anchor="middle" font-weight="bold">0</text><path d="M 385 315 V 325 H 567 V 315" fill="none" stroke="#526178"/><text x="476" y="350" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">column 0</text><path d="M 577 315 V 325 H 759 V 315" fill="none" stroke="#526178"/><text x="668" y="350" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">column 1</text><path d="M 769 315 V 325 H 951 V 315" fill="none" stroke="#526178"/><text x="860" y="350" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">column 2</text><text x="380" y="388" font-size="18" fill="#172033" text-anchor="start" font-weight="normal">Read DOWN column 0, then column 1, then column 2.</text><rect x="32" y="457" width="936" height="126" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="52" y="490" font-size="22" fill="#172033" text-anchor="start" font-weight="bold">index = x * height + y</text><text x="52" y="526" font-size="19" fill="#1d4ed8" text-anchor="start" font-weight="normal">X at (1, 2):  index = 1 * 3 + 2 = 5;  cells[5] = +1</text><text x="52" y="558" font-size="19" fill="#9a3412" text-anchor="start" font-weight="normal">O at (2, 0):  index = 2 * 3 + 0 = 6;  cells[6] = -1</text><text x="32" y="618" font-size="18" fill="#526178" text-anchor="start" font-weight="normal">Small board numbers show vector indices. Empty cells become 0.</text>
  </g>
</svg>
