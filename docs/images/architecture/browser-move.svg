<rect x="460" y="34" width="320" height="84" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<rect x="476" y="53" width="4" height="46" rx="2" fill="#3669ca" stroke="none"/>
<text x="493" y="68" text-anchor="start" font-size="21" font-weight="700" fill="#172b46">Page</text>
<text x="493" y="95" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Main thread / display and input</text>
<rect x="850" y="24" width="340" height="490" rx="18" fill="#eef2f8" stroke="none"/>
<path d="M1020 118 L1020 521" fill="none" stroke="#dce5ef" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 7"/>
<rect x="860" y="38" width="320" height="84" rx="14" fill="#e7edf5" stroke="none"/>
<rect x="860" y="34" width="320" height="84" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<rect x="876" y="53" width="4" height="46" rx="2" fill="#148579" stroke="none"/>
<text x="893" y="68" text-anchor="start" font-size="21" font-weight="700" fill="#172b46">Worker + Wasm</text>
<text x="893" y="95" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Rules, session and AI controllers</text>
<rect x="236" y="140" width="368" height="58" rx="10" fill="#f6f8fc" stroke="none"/>
<text x="420" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#172b46">Choose an action</text>
<path d="M220 173 L620 173" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M620 173 L610.996 177.35" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M620 173 L610.996 168.65" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<text x="420" y="196" text-anchor="middle" font-size="14" font-weight="400" fill="#526780">from the displayed legal choices</text>
