<text x="820" y="243" text-anchor="middle" font-size="18" font-weight="700" fill="#172b46">Versioned command</text>
<path d="M620 256 L1020 256" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M1020 256 L1011 260.35" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M1020 256 L1011 251.65" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<text x="820" y="279" text-anchor="middle" font-size="14" font-weight="400" fill="#526780">Rust checks position and applies move</text>
<rect x="636" y="306" width="368" height="58" rx="10" fill="#f6f8fc" stroke="none"/>
<text x="820" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#172b46">View + accepted effects</text>
