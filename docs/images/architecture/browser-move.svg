<text x="420" y="409" text-anchor="middle" font-size="18" font-weight="700" fill="#172b46">Action information</text>
<path d="M620 422 L220 422" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M220 422 L229.004 417.65" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M220 422 L229.004 426.35" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<text x="420" y="445" text-anchor="middle" font-size="14" font-weight="400" fill="#526780">Love Letter screen, when enabled</text>
<rect x="236" y="472" width="368" height="58" rx="10" fill="#f6f8fc" stroke="none"/>
<text x="420" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#172b46">Continue presentation</text>
<path d="M220 505 L620 505" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M620 505 L610.996 509.35" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M620 505 L610.996 500.65" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<text x="420" y="528" text-anchor="middle" font-size="14" font-weight="400" fill="#526780">rules have already resolved the move</text>
<path d="M44 542 L1196 542" fill="none" stroke="#dce5ef" stroke-width="2" stroke-linecap="round"/>
<text x="44" y="573" text-anchor="start" font-size="16" font-weight="400" fill="#526780">AI path: prepare / poll a proposal, then commit only if current. Reveal mode changes presentation only.</text>
</g>
