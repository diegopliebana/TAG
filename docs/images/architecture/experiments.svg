<rect x="960" y="80" width="4" height="98" rx="2" fill="#a46c18" stroke="none"/>
<text x="977" y="95" text-anchor="start" font-size="21" font-weight="700" fill="#172b46">Report</text>
<text x="977" y="122" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Per-seat + combined results</text>
<text x="977" y="145" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Chosen ranking convention</text>
