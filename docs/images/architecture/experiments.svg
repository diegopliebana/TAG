<text x="613" y="356" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Accepted moves, in their recorded order</text>
<text x="613" y="379" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Selected with reporting.include_actions</text>
