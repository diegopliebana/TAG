<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" role="img" aria-labelledby="title description">
<title id="title">Turn a configuration into evidence</title>
<desc id="description">Experiment configuration creates a seat and seed schedule. Games execute with independent RNG streams, then reports retain per-seat and combined outcomes. Optional action records support later analysis.</desc>
<rect width="1240" height="510" fill="#f6f8fc"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="44" y="65" width="252" height="136" rx="14" fill="#e7edf5" stroke="none"/>
<rect x="44" y="61" width="252" height="136" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<rect x="60" y="80" width="4" height="98" rx="2" fill="#3669ca" stroke="none"/>
<text x="77" y="95" text-anchor="start" font-size="21" font-weight="700" fill="#172b46">Configure</text>
<text x="77" y="122" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Game rules + agent settings</text>
<text x="77" y="145" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Budgets, seeds and limits</text>
<rect x="344" y="65" width="252" height="136" rx="14" fill="#e7edf5" stroke="none"/>
<rect x="344" y="61" width="252" height="136" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<rect x="360" y="80" width="4" height="98" rx="2" fill="#7656b5" stroke="none"/>
<text x="377" y="95" text-anchor="start" font-size="21" font-weight="700" fill="#172b46">Schedule</text>
<text x="377" y="122" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Rotate or fix player seats</text>
<text x="377" y="145" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Per-game RNG streams</text>
<rect x="644" y="65" width="252" height="136" rx="14" fill="#e7edf5" stroke="none"/>
<rect x="644" y="61" width="252" height="136" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<rect x="660" y="80" width="4" height="98" rx="2" fill="#148579" stroke="none"/>
<text x="677" y="95" text-anchor="start" font-size="21" font-weight="700" fill="#172b46">Run games</text>
<text x="677" y="122" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Apply accepted decisions</text>
<text x="677" y="145" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Outcomes + truncations</text>
<rect x="944" y="65" width="252" height="136" rx="14" fill="#e7edf5" stroke="none"/>
