<text x="770" y="236" text-anchor="middle" font-size="15" font-weight="400" fill="#526780">trace</text>
<text x="66" y="301" text-anchor="start" font-size="13" font-weight="700" fill="#3669ca">REPRODUCIBILITY</text>
<text x="66" y="333" text-anchor="start" font-size="18" font-weight="700" fill="#172b46">Keep resolved seeds and configuration</text>
<text x="66" y="360" text-anchor="start" font-size="17" font-weight="400" fill="#526780">alongside model identity and results.</text>
<path d="M44 449 L1196 449" fill="none" stroke="#dce5ef" stroke-width="2" stroke-linecap="round"/>
<text x="44" y="480" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Keep settings, seat assignments, seeds and outcome definitions with the recorded experiment results.</text>
</g>
</svg>
