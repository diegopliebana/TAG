<rect x="862" y="292" width="316" height="90" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<rect x="878" y="311" width="4" height="52" rx="2" fill="#3669ca" stroke="none"/>
<text x="895" y="326" text-anchor="start" font-size="21" font-weight="700" fill="#172b46">Planning RNG</text>
<text x="895" y="353" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Sampling + simulated future chance</text>
<path d="M1020 292 L1020 227" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M1020 227 L1024.35 236.004" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<path d="M1020 227 L1015.65 236.004" fill="none" stroke="#3669ca" stroke-width="2" stroke-linecap="round"/>
<text x="620" y="298" text-anchor="middle" font-size="17" font-weight="700" fill="#148579">Used by agents and encoders</text>
<text x="620" y="327" text-anchor="middle" font-size="16" font-weight="400" fill="#526780">Permitted facts only</text>
<path d="M44 499 L1196 499" fill="none" stroke="#dce5ef" stroke-width="2" stroke-linecap="round"/>
<text x="44" y="530" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Separate RNG streams preserve real-game progress while search explores possible continuations.</text>
</g>
</svg>
