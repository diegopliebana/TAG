<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" role="img" aria-labelledby="title description">
<title id="title">One engine, three ways to run it</title>
<desc id="description">Native experiments, Python through PyO3, and the browser through Wasm use the same Rust engine. The engine groups rules/state, agents/search and runners/sessions; optional persistence and inference remain separate from rules.</desc>
