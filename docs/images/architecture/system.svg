<text x="851" y="449" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Apply accepted decisions</text>
<text x="851" y="472" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Results, history and branches</text>
<text x="66" y="530" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Optional engine features: replay files, JSON search configuration, local model inference</text>
<path d="M44 579 L1196 579" fill="none" stroke="#dce5ef" stroke-width="2" stroke-linecap="round"/>
<text x="44" y="610" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Arrows mean uses. Python and browser adapters share the engine; game rules stay in Rust.</text>
