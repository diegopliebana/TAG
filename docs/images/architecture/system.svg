<text x="475" y="422" text-anchor="start" font-size="21" font-weight="700" fill="#172b46">Agents + search</text>
<text x="475" y="449" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Random, OSLA and MCTS</text>
<text x="475" y="472" text-anchor="start" font-size="16" font-weight="400" fill="#526780">Independent simulated worlds</text>
<rect x="818" y="392" width="356" height="116" rx="14" fill="#e7edf5" stroke="none"/>
<rect x="818" y="388" width="356" height="116" rx="14" fill="#ffffff" stroke="#dce5ef"/>
<rect x="834" y="407" width="4" height="78" rx="2" fill="#148579" stroke="none"/>
