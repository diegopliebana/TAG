<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700"
    viewBox="0 0 1000 700" role="img" aria-labelledby="title description">
  <title id="title">Board to own, opposing and empty tensor channels</title>
  <desc id="description">The same observation becomes three 3 by 3 channels. Own has a 1 at row 2 column 1; opposing has a 1 at row 0 column 2; empty has 1 at every other cell. The tensor has shape [3,3,3], indexed channel, row y, column x.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M 0 0 L 8 4 L 0 8 Z" fill="#526178"/>
  </marker></defs>
  <rect width="1000" height="700" rx="12" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="43" font-size="28" fill="#172033" text-anchor="start" font-weight="bold">2. Represent the same board as three grids</text><text x="32" y="77" font-size="18" fill="#172033" text-anchor="start" font-weight="normal">Each grid is a channel: 1 marks a matching cell; 0 means no match.</text><text x="61" y="129" font-size="20" fill="#172033" text-anchor="start" font-weight="bold">Same observation</text><text x="150.5" y="150" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">column x</text><text x="93.5" y="178" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">0</text><text x="48" y="229.5" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">0</text><text x="150.5" y="178" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">1</text><text x="48" y="286.5" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">1</text><text x="207.5" y="178" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">2</text><text x="48" y="343.5" font-size="16" fill="#526178" text-anchor="middle" font-weight="normal">2</text><text x="48" y="395" font-size="16" fill="#526178" text-anchor="start" font-weight="normal">row y</text><rect x="65" y="195" width="57" height="57" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="93.5" y="231.48000000000002" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><rect x="122" y="195" width="57" height="57" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.5" y="231.48000000000002" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><rect x="179" y="195" width="57" height="57" rx="6" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/><text x="207.5" y="231.48000000000002" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold">O</text><rect x="65" y="252" width="57" height="57" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="93.5" y="288.48" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><rect x="122" y="252" width="57" height="57" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.5" y="288.48" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><rect x="179" y="252" width="57" height="57" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="207.5" y="288.48" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><rect x="65" y="309" width="57" height="57" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="93.5" y="345.48" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><rect x="122" y="309" width="57" height="57" rx="6" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.5" y="345.48" font-size="30" fill="#1d4ed8" text-anchor="middle" font-weight="bold">X</text><rect x="179" y="309" width="57" height="57" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1.5"/><text x="207.5" y="345.48" font-size="30" fill="#9a3412" text-anchor="middle" font-weight="bold"></text><path d="M 264 276 L 309 276" fill="none" stroke="#526178" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420.5" y="125" font-size="17" fill="#526178" text-anchor="middle" font-weight="normal">channel 0</text><text x="420.5" y="153" font-size="18" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Own pieces (X)</text><text x="363.5" y="183" font-size="15" fill="#526178" text-anchor="middle" font-weight="normal">0</text><text x="323" y="228.5" font-size="15" fill="#526178" text-anchor="middle" font-weight="normal">0</text><text x="420.5" y="183" font-size="15" fill="#526178" text-anchor="middle" font-weight="normal">1</text><text x="323" y="285.5" font-size="15" fill="#526178" text-anchor="middle" font-weight="normal">1</text><text x="477.5" y="183" font-size="15" fill="#526178" text-anchor="middle" font-weight="normal">2</text><text