3" font-size="20" fill="#172033" text-anchor="start" font-weight="normal">Read a value as board[channel, y, x].</text><text x="52" y="560" font-size="19" fill="#1d4ed8" text-anchor="start" font-weight="normal">For X at (1, 2):  board[0, 2, 1] = 1;  board[1, 2, 1] = 0;  board[2, 2, 1] = 0.</text><text x="32" y="633" font-size="18" fill="#526178" text-anchor="start" font-weight="normal">Channel order: own / opposing / empty. Read across each grid row, then down.</text><text x="32" y="665" font-size="18" fill="#526178" text-anchor="start" font-weight="normal">This is a new encoding of the board, not a direct reshape of the cells vector.</text>
