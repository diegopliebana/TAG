[package]
name = "tag-browser"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tag-rust = { path = "../..", features = ["replay", "inference", "mcts-json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
wasm-bindgen = "=0.2.129"
