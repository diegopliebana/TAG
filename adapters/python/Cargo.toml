[package]
name = "tag-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
publish = false

# A separate workspace keeps Python dependency resolution and linking out of
# ordinary engine/browser builds. The engine remains a path dependency.
[workspace]

[lib]
name = "_engine"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
tag-rust = { path = "../..", features = ["mcts-json"] }
pyo3 = "=0.29.3"
numpy = "=0.29.0"
serde_json = "=1.0.152"


# Benchmark code is kept outside the user-facing examples.
[[example]]
name = "benchmark_osla"
path = "../../tools/benchmarks/osla/native.rs"
