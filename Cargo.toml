[package]
name = "tag-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
mcts-json = ["dep:serde", "dep:serde_json"]
replay = ["dep:serde", "dep:serde_json"]
inference = ["dep:serde", "dep:serde_json"]

[dependencies]
rand_chacha = { version = "=0.9.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.152", optional = true, features = ["float_roundtrip"] }

[[example]]
name = "mcts"
required-features = ["mcts-json"]

[[example]]
name = "match_play"
required-features = ["mcts-json", "replay"]

[[example]]
name = "tournament"
required-features = ["mcts-json", "replay"]

[[example]]
name = "replay"
required-features = ["replay"]

[[example]]
name = "model_inference"
required-features = ["inference"]

[[example]]
name = "save_files"
required-features = ["replay"]

[workspace]
members = [".", "adapters/browser"]
# Build/link the Python adapter separately using its own manifest and lock file.
exclude = ["adapters/python"]
default-members = ["."]
resolver = "3"

[[example]]
name = "research_measure"
path = "tools/benchmarks/research/native.rs"
required-features = ["mcts-json", "replay"]

[[example]]
name = "research_features"
path = "tools/benchmarks/research/features.rs"
